<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Regisztráció - OntroSYS">
    <title>Regisztráció - OntroSYS</title>
    <link rel="stylesheet" href="../css/css-optimized.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
      .nav-link {
        font-size: 0.9rem ;
        padding: 10px 16px ;
      }
    </style>
</head>
<body>
    <div class="blur-background"></div>
    
    <nav class="felsocucc">
    <button class="mobile-menu-toggle" onclick="toggleMobileMenu()">
        <i class='bx bx-menu'></i>
    </button>
    <div class="nav-center">
        <a href="Fooldal.html" class="nav-link">Főoldal</a>
        <a href="Frissitések.html" class="nav-link">Frissítések</a>
        <a href="rolunk.html" class="nav-link">Rólunk</a>
    </div>
    <div class="nav-right">
        <div class="profil-container">
            <div class="profil-kep" onclick="toggleProfilMenu()">
                <i class='bx bx-user'></i>
            </div>
            <div class="profil-menu" id="profilMenu">
                <a href="Profil.html" class="profil-menu-item">
                    <i class='bx bx-user-circle'></i>
                    Profil
                </a>
                <a href="Beallitas.html" class="profil-menu-item">
                    <i class='bx bx-cog'></i>
                    Beállítások
                </a>
                <a href="regisztracio1.html" class="profil-menu-item" id="registerLink">
                    <i class='bx bx-user-plus'></i>
                    Regisztráció
                </a>
                <a href="web.html" class="profil-menu-item" id="loginLink">
                    <i class='bx bx-log-in'></i>
                    Bejelentkezés
                </a>
                <a href="rolunk.html" class="profil-menu-item">
                    <i class='bx bx-info-circle'></i>
                    Rólunk
                </a>
                <a href="logout.html" class="profil-menu-item" id="logoutLink">
                    <i class='bx bx-log-out'></i>
                    Kijelentkezés
                </a>
            </div>
        </div>
    </div>
</nav>
    
    <main class="form-container">
        <form id="regForm" class="auth-form">
            <h1 class="form-title">Regisztráció</h1>
            
            <input type="text" id="username" class="form-input" placeholder="Felhasználónév" required>
            <input type="email" id="email" class="form-input" placeholder="Email cím" required>
            <input type="password" id="passwd" class="form-input" placeholder="Jelszó" required>
            
            <button type="submit" class="submit-btn">Létrehozás</button>
        </form>
    </main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
function toggleMobileMenu() {
    const navCenter = document.querySelector('.nav-center');
    const navRight = document.querySelector('.nav-right');
    const menuToggle = document.querySelector('.mobile-menu-toggle i');
    
    navCenter.classList.toggle('active');
    navRight.classList.toggle('active');
    

    if (navCenter.classList.contains('active')) {
        menuToggle.classList.remove('bx-menu');
        menuToggle.classList.add('bx-x');
    } else {
        menuToggle.classList.remove('bx-x');
        menuToggle.classList.add('bx-menu');
    }
}

function toggleProfilMenu() {
    const profilMenu = document.querySelector('.profil-menu');
    profilMenu.classList.toggle('active');
}

document.addEventListener('click', function(event) {
    const nav = document.querySelector('.felsocucc');
    const menuToggle = document.querySelector('.mobile-menu-toggle');
    const navCenter = document.querySelector('.nav-center');
    const navRight = document.querySelector('.nav-right');
    const profilContainer = document.querySelector('.profil-container');
    const profilMenu = document.querySelector('.profil-menu');
    

    if (!nav.contains(event.target) && (navCenter.classList.contains('active') || navRight.classList.contains('active'))) {
        navCenter.classList.remove('active');
        navRight.classList.remove('active');
        const menuIcon = document.querySelector('.mobile-menu-toggle i');
        menuIcon.classList.remove('bx-x');
        menuIcon.classList.add('bx-menu');
    }
    
    if (!profilContainer.contains(event.target) && profilMenu.classList.contains('active')) {
        profilMenu.classList.remove('active');
    }
});

window.addEventListener('resize', function() {
    const navCenter = document.querySelector('.nav-center');
    const navRight = document.querySelector('.nav-right');
    const menuIcon = document.querySelector('.mobile-menu-toggle i');
    
    if (window.innerWidth > 768) {
        navCenter.classList.remove('active');
        navRight.classList.remove('active');
        menuIcon.classList.remove('bx-x');
        menuIcon.classList.add('bx-menu');
    }
});

document.getElementById('regForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const formData = {
        username: document.getElementById('username').value,
        email: document.getElementById('email').value,
        passwd: document.getElementById('passwd').value
    };

    try {
        const response = await fetch('../regisztracio.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(formData)
        });

        const res = await response.json();

        if (res.success) {
            alert('Sikeres regisztráció! Most már bejelentkezhetsz.');
            window.location.href = 'web.html';
        } else {
            alert(res.message);
        }
    } catch (error) {
        alert('Hiba a szerverkapcsolatban!');
    }
});

// Téma alkalmazása
function applyTheme() {
    const savedTheme = localStorage.getItem('theme') || 'auto';
    
    if (savedTheme === 'dark') {
        document.body.classList.add('inverted-theme');
    }
}

document.addEventListener('DOMContentLoaded', applyTheme);

function loadUserData() {
    const userData = localStorage.getItem('user');
    if (userData) {
        const user = JSON.parse(userData);
        
        // Bejelentkezett felhasználó
        const registerLink = document.getElementById('registerLink');
        const loginLink = document.getElementById('loginLink');
        const logoutLink = document.getElementById('logoutLink');
        
        if (registerLink) registerLink.style.display = 'none';
        if (loginLink) loginLink.style.display = 'none';
        if (logoutLink) logoutLink.style.display = 'block';
    } else {
        // Nincs bejelentkezve
        const registerLink = document.getElementById('registerLink');
        const loginLink = document.getElementById('loginLink');
        const logoutLink = document.getElementById('logoutLink');
        
        if (registerLink) registerLink.style.display = 'none';
        if (loginLink) loginLink.style.display = 'block';
        if (logoutLink) logoutLink.style.display = 'none';
    }
}
document.addEventListener("DOMContentLoaded", function() {
    loadUserData();
});
</script>

<style>
.inverted-theme {
    filter: invert(1) hue-rotate(180deg);
}

.inverted-theme img,
.inverted-theme video,
.inverted-theme canvas,
.inverted-theme iframe {
    filter: invert(1) hue-rotate(180deg);
}

.inverted-theme .blur-background {
    filter: invert(1) hue-rotate(180deg) blur(5px);
}
</style>
</body>
</html>
