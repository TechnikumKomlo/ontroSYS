  <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<body>

<div class="hatter-kep"></div>

<nav class="felso-cucc">

    <div class="nav-center">

        <a href="Frissitések.html" class="nav-link">Frissítések</a>
       

    </div>

    <div class="nav-right">

        <div class="profil-kontener">
          <div class="profil-kep" onclick="toggleProfilMenu()">
                <i class='bx bx-user'></i>

            </div>

            <div class="profil-menu" id="profilMenu">

                <a href="Profil.html" class="profil-menu-item">
                    <i class='bx bx-user-circle'></i>
                    Profil

                </a>

                <a href="Beallitas.html" class="profil-menu-item">
                    <i class='bx bx-cog'></i>

                </a>

                <a href="regisztracio1.html" class="profil-menu-item" id="registerLink">
                    <i class='bx bx-user-plus'></i>

                </a>

                <a href="web.html" class="profil-menu-item" id="loginLink">

                </a>
                <a href="rolunk.html" class="profil-menu-item">

</nav>

  <main class="container">

    <div class="content">

      <div class="row align-items-center justify-content-center g-4">
        <div class="col-md-6 text-center text-md-start">

          <h1 class="focim">OntroSYS</h1>
          <p class="alcim">A Leggyorsabb, Legbiztonságosabb, Legkényelmesebb fájlkezelő szoftvermegoldás.</p>
          <div id="welcomeMessage" class="welcome-message" style="display: none;">
            <h3>Üdvözlünk, <span id="usernameDisplay"></span>!</h3>
          </div>

          <a href="/download/OntroSYS Installer.exe" download class="letoltes-gomb btn btn-primary btn-lg">

            <i class="letoltes"></i>
        Letöltés
          </a>
        </div>

        <div class="col-md-6">
        <div id="imageCarousel" class="carousel slide" data-bs-ride="carousel">

            <div class="carousel-inner">
              <div class="carousel-item active">

                <img src="../kepek/image1.png" class="d-block w-100 rounded-3 shadow" alt="OntroSYS 1">

              </div>

              <div class="carousel-item">
                <img src="../kepek/image2.png" class="d-block w-100 rounded-3 shadow" alt="OntroSYS 2">

              </div>

              <div class="carousel-item">
                <img src="../kepek/image3.png" class="d-block w-100 rounded-3 shadow" alt="OntroSYS 3">

              </div>

              <div class="carousel-item">

                <img src="../kepek/image4.png" class="d-block w-100 rounded-3 shadow" alt="OntroSYS 4">
              </div>

            </div>

            <button class="carousel-control-prev" type="button" data-bs-target="#imageCarousel" data-bs-slide="prev">
              <span class="carousel-control-prev-icon" aria-hidden="true"></span>
              <span class="visually-hidden">Előző</span>

            </button>

            <button class="carousel-control-next" type="button" data-bs-target="#imageCarousel" data-bs-slide="next">

              <span class="carousel-control-next-icon" aria-hidden="true"></span>
              <span class="visually-hidden">Következő</span>

            </button>

            <div class="carousel-indicators">

              <button type="button" data-bs-target="#imageCarousel" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
              <button type="button" data-bs-target="#imageCarousel" data-bs-slide-to="1" aria-label="Slide 2"></button>
              <button type="button" data-bs-target="#imageCarousel" data-bs-slide-to="2" aria-label="Slide 3"></button>
              <button type="button" data-bs-target="#imageCarousel" data-bs-slide-to="3" aria-label="Slide 4"></button>

            </div>
       </div>
        </div>

      </div>
    </div>
  </main>

  

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>

    function toggleMobileMenu() {

        const navCenter = document.querySelector('.nav-center');
        const navRight = document.querySelector('.nav-right');
        const menuToggle = document.querySelector('.mobil-menu-gomb i');

        

        navCenter.classList.toggle('active');
        navRight.classList.toggle('active');

        

        if (navCenter.classList.contains('active')) {
            menuToggle.classList.remove('bx-menu');
            menuToggle.classList.add('bx-x');

        } else {

            menuToggle.classList.remove('bx-x');
            menuToggle.classList.add('bx-menu');

        }

    }

    function toggleProfilMenu() {

        const profilMenu = document.querySelector('.profil-menu');
        profilMenu.classList.toggle('active');

    }

    document.addEventListener('click', function(event) {

        const nav = document.querySelector('.felso-cucc');
        const menuToggle = document.querySelector('.mobil-menu-gomb');
        const navCenter = document.querySelector('.nav-center');
       const navRight = document.querySelector('.nav-right');
        const profilContainer = document.querySelector('.profil-kontener');
        const profilMenu = document.querySelector('.profil-menu');

        

        if (!nav.contains(event.target) && (navCenter.classList.contains('active') || navRight.classList.contains('active'))) {

            navCenter.classList.remove('active');
            navRight.classList.remove('active');
            const menuIcon = document.querySelector('.mobil-menu-gomb i');
            menuIcon.classList.remove('bx-x');
            menuIcon.classList.add('bx-menu');

        }

        

        if (!profilContainer.contains(event.target) && profilMenu.classList.contains('active')) {
            profilMenu.classList.remove('active');

        }

    });

    window.addEventListener('resize', function() {

        const navCenter = document.querySelector('.nav-center');
        const navRight = document.querySelector('.nav-right');
        const menuIcon = document.querySelector('.mobil-menu-gomb i');

        

        if (window.innerWidth > 768) {

            navCenter.classList.remove('active');
            navRight.classList.remove('active');
            menuIcon.classList.remove('bx-x');
            menuIcon.classList.add('bx-menu');

        }

    });

    function applyTheme() {

        const savedTheme = localStorage.getItem('theme') || 'auto';
        
        if (savedTheme === 'dark') {
            document.body.classList.add('sotet-mod');

        }

    }

    // Bejelentkezett felhasználó nevének betöltése

    function loadUserData() {

        const userData = localStorage.getItem('user');
        if (userData && !document.getElementById('welcomeMessage').classList.contains('shown')) {

            const user = JSON.parse(userData);
            document.getElementById('usernameDisplay').textContent = user.username;
        document.getElementById('welcomeMessage').style.display = 'block';
           document.getElementById('welcomeMessage').classList.add('shown');

            

            // Regisztráció és bejelentkezés linkek elrejtése, kijelentkezés mutatása

            const registerLink = document.getElementById('registerLink');
            const loginLink = document.getElementById('loginLink');
            const logoutLink = document.getElementById('logoutLink');
            if (registerLink) registerLink.style.display = 'none';
            if (loginLink) loginLink.style.display = 'none';
            if (logoutLink) logoutLink.style.display = 'block';
        } else if (!userData) {

            // Nincs bejelentkezve - csak regisztráció és bejelentkezés látszik

            const registerLink = document.getElementById('registerLink');
            const loginLink = document.getElementById('loginLink');
            const logoutLink = document.getElementById('logoutLink');
        if (registerLink) registerLink.style.display = 'block';
            if (loginLink) loginLink.style.display = 'block';
            if (logoutLink) logoutLink.style.display = 'none';

        }

    }

    document.addEventListener('DOMContentLoaded', function() {
        applyTheme();
        loadUserData();

    });

</script>

<style>

.sotet-mod {
    filter: invert(1) hue-rotate(180deg);

}

.sotet-mod img,
.sotet-mod video,
.sotet-mod canvas,

.sotet-mod iframe {
    filter: invert(1) hue-rotate(180deg);

}

.sotet-mod .hatter-kep {
    filter: invert(1) hue-rotate(180deg) blur(5px);

}

</style>
