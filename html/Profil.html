<script>
// Run AFTER the page is fully loaded
document.addEventListener('DOMContentLoaded', function() {
    applyTheme();
    loadProfile();
    loadUserData();
    // Attach submit handler AFTER form exists
    document.getElementById('profileForm').addEventListener('submit', saveProfile);
});

// Load profile data
function loadProfile() {
    const rawUser = localStorage.getItem("user");

    // If nothing stored or literally "undefined", treat as not logged in
    if (!rawUser || rawUser === "undefined") {
        alert("Nem vagy bejelentkezve!");
        window.location.href = "web.html";
        return;
    }

    let user;
    try {
        user = JSON.parse(rawUser);
    } catch (e) {
        console.error("Hibás user adat a localStorage-ben:", rawUser);
        alert("Hiba történt a felhasználói adatok betöltésekor. Jelentkezz be újra!");
        localStorage.removeItem("user");
        window.location.href = "web.html";
        return;
    }

    document.getElementById('username').value = user.username ?? "";
    document.getElementById('email').value = user.email ?? "";

}

// Save profile data
async function saveProfile(e) {
    e.preventDefault();

    const user = JSON.parse(localStorage.getItem("user"));
    if (!user) {
        alert("Nem vagy bejelentkezve!");
        return;
    }

    const formData = {
    action: "update_profile",
    id: user.id,
    username: document.getElementById('username').value,
    email: document.getElementById('email').value,
    bio: "",      // optional for now
    avatar: ""    // optional for now
};

    try {
        const response = await fetch('../profil.php', {
            method: 'POST',
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(formData)
        });

        const raw = await response.text();
        console.log("RAW RESPONSE:", raw);

        let result;
        try {
            result = JSON.parse(raw);
        } catch {
            alert("A backend nem JSON-t küldött vissza!");
            return;
        }

        if (result.success) {
            alert("Profil sikeresen frissítve!");

            // Update localStorage
            localStorage.setItem("user", JSON.stringify(result.user));

            // Update textbox immediately
            document.getElementById('username').value = result.user.username;
        } else {
            alert(result.message);
        }

    } catch (error) {
        alert("Hiba történt: " + error.message);
    }
}

// Logout
function logout() {
    localStorage.removeItem("user");
    window.location.href = "web.html";
}

// Theme
function applyTheme() {
    const savedTheme = localStorage.getItem('theme') || 'auto';
    if (savedTheme === 'dark') {
        document.body.classList.add('sotet-mod');
    }
}

function toggleProfilMenu() {
    document.querySelector('.profil-menu').classList.toggle('active');
}

function loadUserData() {
    const userData = localStorage.getItem('user');
    if (userData) {
        const user = JSON.parse(userData);
        
        // Bejelentkezett felhasználó
        const registerLink = document.getElementById('registerLink');
        const loginLink = document.getElementById('loginLink');
        const logoutLink = document.getElementById('logoutLink');
        
        if (registerLink) registerLink.style.display = 'none';
        if (loginLink) loginLink.style.display = 'none';
        if (logoutLink) logoutLink.style.display = 'block';
    } else {
        // Nincs bejelentkezve
        const registerLink = document.getElementById('registerLink');
        const loginLink = document.getElementById('loginLink');
        const logoutLink = document.getElementById('logoutLink');
        
        if (registerLink) registerLink.style.display = 'block';
        if (loginLink) loginLink.style.display = 'block';
        if (logoutLink) logoutLink.style.display = 'none';
    }
}
</script>
