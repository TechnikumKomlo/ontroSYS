<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Beállítások - OntroSYS">
    <title>Beállítások - OntroSYS</title>
    <link rel="stylesheet" href="../css/css-optimized.css">
    <link rel="stylesheet" href="../css/beallitas.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  
</head>
<body>
    <div class="hatter-kep"></div>
    <nav class="felso-cucc">
        <button class="mobil-menu-gomb" onclick="toggleMobileMenu()">
            <i class='bx bx-menu'></i>
        </button>
        <div class="nav-center">
            <a href="Fooldal.html" class="nav-link">Főoldal</a>
            <a href="Frissitések.html" class="nav-link">Frissítések</a>
            
        </div>
    <div class="nav-right">
        <div class="profil-kontener">
            <div class="profil-kep" onclick="toggleProfilMenu()">
                <i class='bx bx-user'></i>
            </div>
            <div class="profil-menu" id="profilMenu">
                <a href="Profil.html" class="profil-menu-item">
                    <i class='bx bx-user-circle'></i>
                    Profil
                </a>
                <a href="Beallitas.html" class="profil-menu-item">
                    <i class='bx bx-cog'></i>
                    Beállítások
                </a>
                <a href="regisztracio1.html" class="profil-menu-item" id="registerLink">
                    <i class='bx bx-user-plus'></i>
                    Regisztráció
                </a>
                <a href="web.html" class="profil-menu-item" id="loginLink">
                    <i class='bx bx-log-in'></i>
                    Bejelentkezés
                </a>
                <a href="rolunk.html" class="profil-menu-item">
                    <i class='bx bx-info-circle'></i>
                    Rólunk
                </a>
                <a href="logout.html" class="profil-menu-item" id="logoutLink">
                    <i class='bx bx-log-out'></i>
                    Kijelentkezés
                </a>
            </div>
        </div>
    </div>
</nav>
    
    <main class="urlap">
        <form action="" method="post" class="auth-form">
            <h1 class="form-title">Beállítások</h1>
            <div class="beallitascucc">
                <label for="theme" class="form-label">Téma</label>
                <div class="input-wrapper">
                    <i class='bx bx-palette input-icon'></i>
                    <select id="theme" name="theme" class="form-input">
                        <option value="dark">Sötét mód</option>
                        <option value="light">Világos mód</option>
                    </select>
                </div>
            </div>
            <div class="beallitascucc">
                <label for="language" class="form-label">Nyelv</label>
                <div class="input-wrapper">
                    <i class='bx bx-globe input-icon'></i>
                    <select id="language" name="language" class="form-input">
                        <option value="hu">Magyar</option>
                    </select>
                </div>
            </div>
            <div class="form-footer">
                <button type="button" class="secondary-btn" onclick="window.location.href='Fooldal.html';">
                    Vissza a főoldalra
                </button>
            </div>
        </form>
    </main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    function toggleMobileMenu() {
        const navCenter = document.querySelector('.nav-center');
        const navRight = document.querySelector('.nav-right');
        const menuToggle = document.querySelector('.mobil-menu-gomb i');
        
        navCenter.classList.toggle('active');
        navRight.classList.toggle('active');
        
        if (navCenter.classList.contains('active')) {
            menuToggle.classList.remove('bx-menu');
            menuToggle.classList.add('bx-x');
        } else {
            menuToggle.classList.remove('bx-x');
            menuToggle.classList.add('bx-menu');
        }
    }

    function toggleProfilMenu() {
        const profilMenu = document.querySelector('.profil-menu');
        profilMenu.classList.toggle('active');
    }

    document.addEventListener('click', function(event) {
        const nav = document.querySelector('.felso-cucc');
        const menuToggle = document.querySelector('.mobil-menu-gomb');
        const navCenter = document.querySelector('.nav-center');
        const navRight = document.querySelector('.nav-right');
        const profilContainer = document.querySelector('.profil-kontener');
        const profilMenu = document.querySelector('.profil-menu');
        
        if (!nav.contains(event.target) && (navCenter.classList.contains('active') || navRight.classList.contains('active'))) {
            navCenter.classList.remove('active');
            navRight.classList.remove('active');
            const menuIcon = document.querySelector('.mobil-menu-gomb i');
            menuIcon.classList.remove('bx-x');
            menuIcon.classList.add('bx-menu');
        }
        
        if (!profilContainer.contains(event.target) && profilMenu.classList.contains('active')) {
            profilMenu.classList.remove('active');
        }
    });

    window.addEventListener('resize', function() {
        const navCenter = document.querySelector('.nav-center');
        const navRight = document.querySelector('.nav-right');
        const menuIcon = document.querySelector('.mobil-menu-gomb i');
        
        if (window.innerWidth > 768) {
            navCenter.classList.remove('active');
            navRight.classList.remove('active');
            menuIcon.classList.remove('bx-x');
            menuIcon.classList.add('bx-menu');
        }
    });

    function toggleTheme() {
        const themeSelect = document.getElementById('theme');
        const selectedTheme = themeSelect.value;
        
        if (selectedTheme === 'dark') {
            document.body.classList.add('sotet-mod');
            localStorage.setItem('theme', 'dark');
        } else {
            document.body.classList.remove('sotet-mod');
            localStorage.setItem('theme', selectedTheme);
        }
    }

    function loadUserData() {
        const userData = localStorage.getItem('user');
        if (userData) {
            const user = JSON.parse(userData);
            

            const registerLink = document.getElementById('registerLink');
            const loginLink = document.getElementById('loginLink');
            const logoutLink = document.getElementById('logoutLink');
            
            if (registerLink) registerLink.style.display = 'none';
            if (loginLink) loginLink.style.display = 'none';
            if (logoutLink) logoutLink.style.display = 'block';
        } else {
     
            const registerLink = document.getElementById('registerLink');
            const loginLink = document.getElementById('loginLink');
            const logoutLink = document.getElementById('logoutLink');
            
            if (registerLink) registerLink.style.display = 'block';
            if (loginLink) loginLink.style.display = 'block';
            if (logoutLink) logoutLink.style.display = 'none';
        }
    }

    document.addEventListener('DOMContentLoaded', function() {
        const themeSelect = document.getElementById('theme');
        const savedTheme = localStorage.getItem('theme') || 'auto';
        
        themeSelect.value = savedTheme;
        
        if (savedTheme === 'dark') {
            document.body.classList.add('sotet-mod');
        }
        
        themeSelect.addEventListener('change', toggleTheme);
        loadUserData();
    });
</script>

<style>
.sotet-mod {
    filter: invert(1) hue-rotate(180deg);
}
.sotet-mod .hatter-kep {
    background-image: url('../kepek/image2.png') !important;
    filter: invert(1) hue-rotate(180deg) blur(5px);
}
body:not(.sotet-mod) .hatter-kep {
    background-image: url('../kepek/image1.png') !important;
}
.sotet-mod img,
.sotet-mod video,
.sotet-mod canvas,
.sotet-mod iframe {
    filter: invert(1) hue-rotate(180deg);
}
</style>
</body>
</html>
